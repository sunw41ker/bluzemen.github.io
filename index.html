<script>
$(function () {

	// Утановим согласно задания ограничение количества добавляемых ачивок
	achieves.countLimit = 100;

	// Для демонстрации инициализируем контейнер некоторым количеством ачивок
	// с произвольно выбранными из списков именами и изображениями 
	var images = ['./blocks/achieves/ach_crystal-2.jpg', './blocks/achieves/ach_crystal.png'];
	var names = ['crystal1', 'crystal2', 'crystal3', 'crystal4', 'crystal5', 'crystal6', 'crystal7'];

	// Инициализируем контейнер десятью ачивками (опять же для демонстрации)
	achieves.init($('.achieves'), 10, images, names);

	// добавляем что-нибудь своё...
	achieves.add($('.achieves'), 'crystal1', './blocks/achieves/ach_crystal.png');
});
</script>
